[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openstack-maintenance-check"
version = "0.2.0.dev0"
description = "Explain source-host maintenance blockers from OpenStack inventory evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad AbuNemeh" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
live = ["openstacksdk>=4.17,<5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.15.20", "build>=1.2", "pre-commit>=4",
       "openstacksdk>=4.17,<5", "requests-mock>=1.12"]

[project.scripts]
maintenance-check = "openstack_maintenance_check.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openstack_maintenance_check"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=openstack_maintenance_check --cov-branch --cov-report=term-missing --cov-fail-under=90"
